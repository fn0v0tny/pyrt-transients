<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transient Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
    }
    
    #sidebar {
      width: 300px;
      border-right: 1px solid #ccc;
      overflow-y: auto;
      background-color: #f5f5f5;
    }
    
    #main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    .candidate-item {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }
    
    .candidate-item:hover {
      background-color: #e9e9e9;
    }
    
    .candidate-item.selected {
      background-color: #e0f0ff;
    }
    
    .candidate-id {
      font-weight: bold;
    }
    
    .candidate-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8em;
      color: #666;
    }
    
    .detail-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .detail-section {
      flex: 1;
    }
    
    .cutout-viewer {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      background-color: #f9f9f9;
    }
    
    .cutout-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .cutout-time-info {
      text-align: center;
      font-weight: bold;
    }
    
    .date-display {
      font-size: 0.8em;
      color: #666;
      margin-top: 2px;
    }
    
    .cutout-image-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .cutout-image {
      max-width: 100%;
      border: 1px solid #ddd;
    }
    
    .cutout-filename {
      font-size: 0.8em;
      color: #666;
      margin-top: 5px;
      font-family: monospace;
    }
    
    .cutout-slider-container {
      margin-top: 10px;
    }
    
    .cutout-slider {
      width: 100%;
    }
    
    .properties-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .properties-table th, .properties-table td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    
    .properties-table th {
      font-weight: bold;
      width: 100px;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-available;
    }
    
    /* Lightcurve specific styles */
    .lightcurve-container {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #f9f9f9;
    }
    
    .lightcurve-plot img {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    .lightcurve-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
      font-size: 0.9em;
    }
    
    .lightcurve-interactive {
      margin-top: 20px;
    }
    
    .lightcurve-interactive h4 {
      margin-bottom: 10px;
      color: #333;
    }
    
    #lightcurve-plot {
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: white;
      overflow: hidden;
    }
    
    #lightcurve-plot svg {
      display: block;
    }
    
    /* Variability indicator */
    .variability-indicator {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.7em;
      font-weight: bold;
      margin-left: 5px;
    }
    
    .variability-yes {
      background-color: #e74c3c;
      color: white;
    }
    
    .variability-no {
      background-color: #27ae60;
      color: white;
    }
    
    /* Enhanced candidate list styling */
    .lightcurve-badge {
      color: #27ae60;
      font-size: 0.8em;
      margin-left: 5px;
    }
    
    .candidate-stats {
      font-size: 0.7em;
      color: #666;
      margin-top: 3px;
    }
    
    /* Candidate type badges */
    .candidate-type-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.7em;
      font-weight: bold;
      margin-left: 5px;
    }
    
    /* Filter controls */
    #filter-controls {
      background-color: #f8f9fa;
    }
    
    #filter-controls input[type="radio"] {
      margin-right: 5px;
    }
    
    #filter-controls input[type="checkbox"] {
      margin-right: 5px;
    }
    
    /* Enhanced properties table */
    .properties-table td span {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div style="padding: 15px; background-color: #2c3e50; color: white;">
      <h2 style="margin: 0;">Transient Viewer</h2>
      <div style="font-size: 0.8em; margin-top: 5px; opacity: 0.8;">
        📈 = Has lightcurve data<br>
        ✨ = New | 📈 = Brightening | 📉 = Fading | 🧵 = Trail
      </div>
    </div>
    <div id="filter-controls"></div>
    <div id="candidate-list">
      <div id="candidate-list-content">
        <div style="padding: 20px; text-align: center;">Loading candidates...</div>
      </div>
    </div>
    <div id="pagination-controls"></div>
  </div>
  
  <div id="main-content">
    <div id="candidate-detail">
      <div style="text-align: center; color: #666; margin-top: 50px;">
        Select a candidate from the list to view details
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
