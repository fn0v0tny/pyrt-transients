<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SN Search Viewer</title>

  <!-- Aladin Lite v3 for sky overlay -->
  <link rel="stylesheet" href="https://aladin.u-strasbg.fr/AladinLite/api/v3/latest/aladin.min.css">

  <style>
    /* ── Base layout ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; padding: 0;
      display: flex;
      height: 100vh;
      background: #f0f2f5;
      color: #222;
    }

    /* ── Sidebar ──────────────────────────────────────────────────────── */
    #sidebar {
      width: 310px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
      background: #fff;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 14px 16px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      color: #fff;
      flex-shrink: 0;
    }

    #sidebar-header h2 { margin: 0; font-size: 1.1em; letter-spacing: 0.5px; }
    #sidebar-header .legend {
      font-size: 0.72em; margin-top: 6px; opacity: 0.8; line-height: 1.6;
    }

    #filter-controls {
      padding: 10px 12px;
      border-bottom: 1px solid #e0e0e0;
      background: #f8f9fa;
      flex-shrink: 0;
    }

    #filter-controls h4 { margin: 0 0 8px; font-size: 0.82em; color: #555; }

    .filter-row {
      display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px;
    }

    .filter-btn {
      padding: 3px 9px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
      font-size: 0.74em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active { border-color: #0f3460; background: #0f3460; color: #fff; }
    .filter-btn:hover:not(.active) { background: #e8eaf0; }

    #candidate-list { flex: 1; overflow-y: auto; }

    /* ── Candidate list items ─────────────────────────────────────────── */
    .candidate-item {
      padding: 9px 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.1s;
    }
    .candidate-item:hover { background: #f0f4ff; }
    .candidate-item.selected { background: #e3ecff; border-left: 3px solid #0f3460; }

    .cand-top {
      display: flex; justify-content: space-between; align-items: center;
    }
    .cand-id {
      font-weight: 600; font-size: 0.85em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 170px;
    }
    .sn-score-pill {
      font-size: 0.72em; font-weight: 700;
      padding: 2px 7px; border-radius: 10px;
      background: #0f3460; color: #fff;
      white-space: nowrap; flex-shrink: 0;
    }
    .cand-row2 {
      display: flex; justify-content: space-between;
      font-size: 0.76em; color: #555; margin-top: 3px;
    }

    .gal-badge {
      display: inline-block;
      padding: 1px 6px; border-radius: 10px;
      font-size: 0.70em; font-weight: 600;
      margin-left: 4px; vertical-align: middle;
    }
    .gal-in_galaxy  { background: #d4edda; color: #155724; }
    .gal-nuclear    { background: #fff3cd; color: #856404; }
    .gal-isolated   { background: #e2e3e5; color: #383d41; }

    .type-badge {
      display: inline-block;
      padding: 1px 6px; border-radius: 10px;
      font-size: 0.70em; font-weight: 700;
      color: #fff; margin-left: 4px;
    }

    .tns-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: #e74c3c;
      margin-left: 5px; vertical-align: middle;
      title: 'Matched on TNS';
    }

    /* ── Main content ─────────────────────────────────────────────────── */
    #main-content {
      flex: 1; overflow-y: auto; padding: 20px;
    }

    /* ── Section cards ────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid #dde1e7;
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 18px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 1em;
      color: #1a1a2e;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    /* ── Cutout viewer ────────────────────────────────────────────────── */
    .cutout-nav {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 10px;
    }
    .cutout-time-info { text-align: center; font-size: 0.9em; font-weight: 600; }
    .date-display { font-size: 0.78em; color: #666; margin-top: 2px; }

    .cutout-image-container {
      display: flex; flex-direction: column; align-items: center; margin-bottom: 8px;
    }
    .cutout-image { max-width: 100%; border: 1px solid #ddd; border-radius: 4px; }
    .cutout-filename { font-size: 0.75em; color: #888; margin-top: 4px; font-family: monospace; }

    /* ── Triplet cutout viewer (subtraction candidates: sci/ref/diff) ───── */
    .cutout-triplet {
      display: flex; gap: 8px; justify-content: center; margin-bottom: 8px;
    }
    .triplet-panel {
      display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0;
    }
    .triplet-label {
      font-size: 0.7em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
      color: #888; margin-bottom: 4px;
    }
    .triplet-image {
      width: 100%; max-width: 180px; aspect-ratio: 1 / 1; object-fit: contain;
      border: 1px solid #ddd; border-radius: 4px; background: #111;
    }
    .triplet-missing {
      width: 100%; max-width: 180px; aspect-ratio: 1 / 1;
      border: 1px dashed #ccc; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      color: #bbb; font-size: 0.75em; text-align: center; padding: 8px;
    }

    .cutout-slider { width: 100%; margin-top: 8px; }
    .cutouts-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .cutouts-strip img {
      width: 80px; height: 80px; object-fit: contain;
      border: 1px solid #ddd; border-radius: 3px; cursor: pointer;
    }
    .cutouts-strip img:hover { border-color: #0f3460; }

    nav-btn {
      padding: 5px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }

    /* ── Host galaxy card ─────────────────────────────────────────────── */
    .galaxy-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
      font-size: 0.9em;
    }
    .galaxy-info-grid dt { color: #666; font-weight: 600; margin-bottom: 2px; }
    .galaxy-info-grid dd { margin: 0; }

    /* Aladin embed */
    #aladin-lite-div {
      width: 100%; height: 280px;
      border-radius: 6px; overflow: hidden;
      border: 1px solid #ddd;
      margin-top: 12px;
    }

    /* ── TNS card ─────────────────────────────────────────────────────── */
    .tns-matched {
      background: #fff5f5; border-left: 4px solid #e74c3c;
      padding: 10px 14px; border-radius: 4px;
      font-size: 0.9em;
    }
    .tns-name { font-size: 1.3em; font-weight: 700; color: #c0392b; }
    .tns-not-matched { color: #888; font-size: 0.9em; }

    /* ── Properties table ─────────────────────────────────────────────── */
    .props {
      width: 100%; border-collapse: collapse; font-size: 0.88em;
    }
    .props th, .props td {
      padding: 6px 10px; text-align: left; border-bottom: 1px solid #f0f0f0;
    }
    .props th { color: #666; font-weight: 600; width: 130px; }
    .props tr:last-child th, .props tr:last-child td { border-bottom: none; }

    .val-ok   { color: #155724; }
    .val-warn { color: #856404; }
    .val-bad  { color: #721c24; }

    /* ── Lightcurve card ──────────────────────────────────────────────── */
    .lc-canvas-wrap {
      position: relative; height: 260px;
    }
    .lc-legend {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 10px; font-size: 0.78em;
    }
    .lc-legend-item {
      display: flex; align-items: center; gap: 4px;
    }
    .lc-legend-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .lc-no-data { color: #aaa; font-size: 0.88em; padding: 10px 0; }

    /* ── Placeholder ──────────────────────────────────────────────────── */
    .placeholder {
      text-align: center; color: #aaa; padding: 60px 20px; font-size: 1em;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>🔭 SN Search Viewer</h2>
    <div class="legend">
      <span class="gal-badge gal-in_galaxy">in_galaxy</span> SN candidate in host &nbsp;
      <span class="gal-badge gal-nuclear">nuclear</span> AGN/TDE risk<br>
      <span style="color:#e74c3c; font-weight:700;">●</span> Matched on TNS &nbsp;
      SN score = quality × type + galaxy + morphology
    </div>
  </div>

  <div id="filter-controls">
    <h4>Filter by type</h4>
    <div class="filter-row" id="type-filters"></div>
    <h4 style="margin-top:8px;">Filter by host</h4>
    <div class="filter-row" id="gal-filters"></div>
    <div style="margin-top:8px; font-size:0.78em;">
      <label>
        <input type="checkbox" id="tns-only" onchange="sv.applyFilters()">
        TNS-matched only
      </label>
    </div>
  </div>

  <div id="candidate-list">
    <div id="candidate-list-content" style="padding:20px; text-align:center; color:#aaa;">Loading…</div>
  </div>
</div>

<div id="main-content">
  <div id="candidate-detail">
    <div class="placeholder">Select a candidate from the list to view details</div>
  </div>
</div>

<!-- Chart.js for lightcurves -->
<script src="./chart.umd.min.js"></script>
<!-- Aladin Lite v3 -->
<script type="text/javascript"
  src="https://aladin.u-strasbg.fr/AladinLite/api/v3/latest/aladin.js"
  charset="utf-8"></script>
<script src="app.js?v=3"></script>
</body>
</html>
