[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrt-transient"
version = "0.2.0"
description = "Transient detection addon for the pyrt astronomical photometry pipeline"
authors = [
    {name = "Filip Novotny"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["astronomy", "transient", "photometry", "detection", "GRB"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# pyrt must be installed separately, from source -- NOT `pip install pyrt`,
# which is an unrelated PyPI ray-tracer package that this "pyrt" entry can't
# distinguish from the real one. See README.md's "Requirements" section.
dependencies = [
    "pyrt",
    # stdpipe declares sep-x itself (its photometry does `import sep_x as
    # sep`); nothing in this package imports it directly, so it isn't
    # listed here -- extraction.py's _patch_sep_sum_circle_clip_kwargs
    # patches whichever module stdpipe.photometry actually bound.
    "stdpipe>=0.3.0",
    "numpy>=1.20.0",
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Website / cutout generation
frontend = [
    "Pillow>=9.0.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]
# Works around a real bug in some stdpipe builds' PS1 skycell normalization
# (see detection/subtraction/templates.py::_patch_normalize_ps1_skycell).
# Not required otherwise -- without it, some PS1 template fetches may fail
# where they would otherwise succeed.
ps1 = [
    "fitsio",
]

[project.scripts]
# Run the detection pipeline directly from the command line
pyrt-transient-pipeline    = "pyrt_transient.pipeline_magic:main"
pyrt-transient-daemon      = "pyrt_transient.transient_daemon:main"
pyrt-transient-sn-pipeline = "pyrt_transient.pipeline_magic_sn:main"

[project.urls]
Repository = "https://github.com/fn0v0tny/pyrt-transients"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrt_transient*"]

[tool.setuptools.package-data]
"pyrt_transient" = [
    "template/**/*",
    "template_sn/**/*",
]
