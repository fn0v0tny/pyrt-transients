# Unit tests on every push/PR (no network needed). The frozen-baseline
# regression check (tools/check_baseline.py) queries Gaia/USNO, so it runs
# only on demand via workflow_dispatch.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Also run tools/check_baseline.py (needs network access to Gaia/VizieR)"
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The real pyrt lives on GitHub; PyPI's "pyrt" is an unrelated ray tracer.
          pip install "git+https://github.com/mates14/pyrt"
          pip install stdpipe fitsio
          pip install -e ".[frontend,dev]"
      - name: Unit tests
        run: pytest tests/ -q
      - name: Baseline regression check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline }}
        run: python tools/check_baseline.py
